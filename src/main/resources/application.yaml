spring:
  application:
    name: payment-router

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_router
    username: postgres
    password: root
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yml

backend:
  travel:
    url: http://localhost:8081/webhook/payment
  ofw:
    url: http://localhost:8081/webhook/payment/datafeed