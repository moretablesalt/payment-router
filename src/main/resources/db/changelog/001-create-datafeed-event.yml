databaseChangeLog:

  - changeSet:
      id: 001-create-datafeed-event
      author: Mark Tiu
      changes:
        - createTable:
            tableName: datafeed_event
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_datafeed_event

              - column:
                  name: reference_no
                  type: VARCHAR(100)

              - column:
                  name: merchant_id
                  type: VARCHAR(50)

              - column:
                  name: gateway_reference
                  type: VARCHAR(100)

              - column:
                  name: amount
                  type: DECIMAL(12,2)

              - column:
                  name: currency
                  type: VARCHAR(10)

              - column:
                  name: success_code
                  type: VARCHAR(10)

              - column:
                  name: payload_raw
                  type: TEXT

              - column:
                  name: payload_decoded
                  type: TEXT

              - column:
                  name: routed_to
                  type: VARCHAR(20)

              - column:
                  name: status
                  type: VARCHAR(20)

              - column:
                  name: retry_count
                  type: INTEGER
                  defaultValueNumeric: 0

              - column:
                  name: received_at
                  type: TIMESTAMP